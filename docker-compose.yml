services:
  basedatos_mysql:
    container_name: basedatos_mysql
    image: mysql:9.5
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: 123456
      TZ: America/La_Paz
    ports:
      - "3333:3306"
    volumes:
      - basedatos_mysql:/var/lib/mysql
      - ./biblioteca_mysql.sql:/docker-entrypoint-initdb.d/biblioteca_mysql.sql
  
  phpmyadmin_mysql:
    container_name: phpmyadmin_mysql
    image: phpmyadmin/phpmyadmin
    restart: always
    depends_on:
      - basedatos_mysql
    ports:
      - "8888:80"
    environment:
      PMA_HOST: basedatos_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
  
  basedatos_postgres:
    container_name: basedatos_postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: biblioteca
    ports:
      - "5444:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
      - ./biblioteca_postgres.sql:/docker-entrypoint-initdb.d/biblioteca_postgres.sql
  
  pgadmin_postgres:
    container_name: pgadmin_postgres
    image: dpage/pgadmin4
    restart: always
    depends_on:
      - basedatos_postgres
    ports:
      - "85:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  basedatos_mysql:
  postgres_db_data: